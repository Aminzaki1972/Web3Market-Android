name: Build Android Releases

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/web3market-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/web3market-signing/release.jks"
          test -s "$RUNNER_TEMP/web3market-signing/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/web3market-signing/release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Build release AAB
        run: gradle bundleRelease --no-daemon

      - name: Verify release APK is signed
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Verify release AAB exists
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Web3Market-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Web3Market-Android-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release AAB
        if: ${{ env.ANDROID_KEYSTORE_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Web3Market-Android-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned release APK
        if: ${{ env.ANDROID_KEYSTORE_FILE == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Web3Market-Android-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned release AAB
        if: ${{ env.ANDROID_KEYSTORE_FILE == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Web3Market-Android-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
